# Automatic release on every push to main.
#
# release-it + @release-it/conventional-changelog read the commits since the
# last v* tag and pick the bump (the commit-msg hook enforces the format):
#   feat:                         → minor
#   type!: or BREAKING CHANGE:     → major
#   fix / perf / update / improve / refactor / revert / build → patch
#   only docs / style / test / ci / chore                       → no release
# Then: lint · type:check · test → bump package.json → CHANGELOG.md → README
# badges → commit `chore(release): vX.Y.Z` → tag → push → GitHub release.
#
# The release commit is pushed with GITHUB_TOKEN, which never triggers another
# workflow run, and this job also skips its own `chore(release)` commits.
# A version bump is a new app runtime (runtimeVersion: appVersion) — ship a new
# build for it (EAS / build:local), not only an OTA update.
#
# If main is branch-protected, allow github-actions[bot] to push, or this job
# fails at the push step (nothing is published in that case).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      increment:
        description: Force a bump (leave empty to infer from commits)
        type: choice
        options: ['', patch, minor, major]
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags: the bump is computed from them

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Anything releasable since the last tag?
        id: releasable
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          if [ -n "${{ inputs.increment }}" ] || \
             git log "$range" --format=%s | grep -qE '^(feat|fix|perf|update|improve|refactor|revert|build)(\(.+\))?!?: ' || \
             git log "$range" --format=%B | grep -q 'BREAKING CHANGE:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/style/test/ci/chore commits since ${last:-the start} — no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.releasable.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm exec release-it ${{ inputs.increment }} --ci
